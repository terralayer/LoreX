name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lorex
          POSTGRES_USER: lorex
          POSTGRES_PASSWORD: lorex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lorex -d lorex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LOREX_DATABASE_URL: postgresql://lorex:lorex@localhost:5432/lorex
      LOREX_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Run migrations
        run: alembic upgrade head
      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend
        run: npm --prefix frontend install
      - name: Build frontend
        run: npm --prefix frontend run build

  benchmark:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lorex
          POSTGRES_USER: lorex
          POSTGRES_PASSWORD: lorex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lorex -d lorex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LOREX_DATABASE_URL: postgresql://lorex:lorex@localhost:5432/lorex
      LOREX_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Run migrations
        run: alembic upgrade head
      - name: Install frontend
        run: npm --prefix frontend install
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Run benchmark baseline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p benchmark-results
          python -m benchmarks.run_baseline --profile ci --output benchmark-results --frontend-dist frontend/dist 2>&1 | tee benchmark-results/runner.log
          python -m benchmarks.run_pr6 --output benchmark-results 2>&1 | tee benchmark-results/pr6-runner.log
          python -m benchmarks.run_pr7 --output benchmark-results 2>&1 | tee benchmark-results/pr7-runner.log
      - name: Publish benchmark summary
        if: always() && hashFiles('benchmark-results/baseline.md') != ''
        run: |
          cat benchmark-results/baseline.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f benchmark-results/pr6-importer.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat benchmark-results/pr6-importer.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f benchmark-results/pr7-metadata.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat benchmark-results/pr7-metadata.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark artifact
        if: always() && hashFiles('benchmark-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lorex-benchmark-baseline
          path: benchmark-results/
