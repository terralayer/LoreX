name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend
        run: npm --prefix frontend install
      - name: Build frontend
        run: npm --prefix frontend run build

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Install frontend
        run: npm --prefix frontend install
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Run benchmark baseline
        run: python -m benchmarks.run_baseline --profile ci --output benchmark-results --frontend-dist frontend/dist
      - name: Publish benchmark summary
        if: always() && hashFiles('benchmark-results/baseline.md') != ''
        run: cat benchmark-results/baseline.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark artifact
        if: always() && hashFiles('benchmark-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lorex-benchmark-baseline
          path: benchmark-results/
