services:
  migrate:
    build: .
    command: ["true"]
    environment:
      LOREX_DATABASE_URL: postgresql://lorex:lorex@postgres:5432/lorex
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LOREX_DATABASE_URL: postgresql://lorex:lorex@postgres:5432/lorex
      LOREX_REDIS_URL: redis://redis:6379/0
      LOREX_CREDENTIAL_KEY: ${LOREX_CREDENTIAL_KEY:-}
    volumes:
      - ./data/config:/config
      - ./data/downloads:/downloads
      - ./data/library:/library
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  nntp-scanner:
    build: .
    command: ["python", "-m", "lorex.workers.nntp_scanner", "--mode", "live"]
    environment:
      LOREX_DATABASE_URL: postgresql://lorex:lorex@postgres:5432/lorex
      LOREX_REDIS_URL: redis://redis:6379/0
      LOREX_CREDENTIAL_KEY: ${LOREX_CREDENTIAL_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  download-worker:
    build: .
    command: ["python", "-m", "lorex.workers.download_worker"]
    environment:
      LOREX_DATABASE_URL: postgresql://lorex:lorex@postgres:5432/lorex
      LOREX_REDIS_URL: redis://redis:6379/0
      LOREX_CREDENTIAL_KEY: ${LOREX_CREDENTIAL_KEY:-}
    volumes:
      - ./data/config:/config
      - ./data/downloads:/downloads
      - ./data/library:/library
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lorex
      POSTGRES_USER: lorex
      POSTGRES_PASSWORD: lorex
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorex -d lorex"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
